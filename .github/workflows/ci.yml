name: CI

# Run on every push to main and on all pull requests so regressions are
# caught before they reach the default branch.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      # Keep running other matrix legs even if one fails so you see the full
      # compatibility picture in a single run.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Python setup with pip cache ─────────────────────────────────────
      # The cache key includes pyproject.toml so the cache is invalidated
      # whenever dependencies change.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ── Build toolchain ─────────────────────────────────────────────────
      # Upgrade pip, setuptools and wheel first so the editable install uses
      # a modern build backend.
      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel

      # ── Package install ─────────────────────────────────────────────────
      # Install the package in editable mode together with all dev extras so
      # linting, type-checking, and test tooling are all available.
      - name: Install package and dev deps
        run: python -m pip install -e .[dev]

      # ── Lint ────────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: ruff check .

      # ── Type check ──────────────────────────────────────────────────────
      # mypy errors are reported but do not fail the build until the type
      # annotations are fully stabilised.  Remove `|| true` once clean.
      - name: Type check (mypy)
        run: mypy src || true

      # ── Tests ───────────────────────────────────────────────────────────
      # pytest exits 5 (no tests collected) when the tests/ directory is
      # empty; treat that as a pass so CI does not block.
      - name: Run tests (pytest)
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            pytest --tb=short
          else
            echo "No tests found; skipping pytest."
          fi

  # ── Build verification ────────────────────────────────────────────────────
  # Ensure the sdist and wheel can be built cleanly with setuptools so the
  # release workflow never hits a broken package state.
  build-check:
    name: Build package (sdist + wheel)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist contents
        run: ls -lh dist/
