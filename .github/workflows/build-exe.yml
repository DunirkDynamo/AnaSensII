name: Build Executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Git tag to build (example: v0.1.0)'
        required: false
        type: string

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_tag }}
    steps:
      - name: Validate manual input
        if: github.event_name == 'workflow_dispatch' && inputs.version_tag == ''
        run: |
          echo "workflow_dispatch requires version_tag (example: v0.1.0)"
          exit 1

      - name: Checkout selected tag or current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag != '' && inputs.version_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name anasens-cli src/anasens/interfaces/cli.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: anasens-exe-${{ env.BUILD_TAG }}-windows
          path: dist/anasens-cli.exe

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/anasens-cli.exe
