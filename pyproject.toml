[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anasens2"
version = "0.1.0"
description = "Electrochemical analysis pipeline for voltammogram preprocessing, calibration, and visualization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AnaSens Developers" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PySide6>=6.7",
  "pandastable>=0.14",
  "openpyxl>=3.1",
  "sympy>=1.13",
  "antlr4-python3-runtime==4.11.*",
  "seaborn>=0.13",
  "pybaselines>=1.0",
  "Ekidna",
  "statsmodels>=0.14",
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "sphinx>=7.4",
  "furo>=2024.7.18"
]

[project.scripts]
anasens = "anasens.interfaces.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["anasens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
